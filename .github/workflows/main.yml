name: Build Vyapar AI Flutter APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Auto-extract if ZIP file uploaded
      - name: Auto-extract ZIP file if present
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Found ZIP file, extracting..."
            unzip -o *.zip
            if [ -d "vyapar_ai_flutter" ]; then
              cp -r vyapar_ai_flutter/* .
            fi
          fi

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VyaparAI-Flutter-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
